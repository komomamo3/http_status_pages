<style>

li{margin:4px 0}
.note{font-size:13px;margin-top:14px}
.footer{text-align:center;font-size:12px;color:#333;margin:8px 0 18px}
@media (max-width:760px){
 .box table,.box tbody,.box tr,.box td{display:block;width:100%}
 .pic{width:auto}
 .pic img{width:min(100%,360px)}
}
</style>
